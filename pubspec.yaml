name: rebirth_2048
description: A biological evolution and ecological revival game.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  cloud_functions: ^6.4.0
  audioplayers: 6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/creatures/chapter_01_ocean/
    - assets/creatures/chapter_02_land/
    - assets/creatures/chapter_03_sky/
    - assets/backgrounds/chapter_01_ocean/
    - assets/backgrounds/chapter_02_land/
    - assets/backgrounds/chapter_03_sky/
    - assets/creatures/chapter_04_history/
    - assets/backgrounds/chapter_04_history/
    - assets/creatures/chapter_05_modern_world/
    - assets/backgrounds/chapter_05_tech/
    - assets/onboarding/
    - assets/creatures/chapter_06_universe/
    - assets/backgrounds/chapter_06_universe/
    - assets/avatars/

    - assets/tools/
    - assets/audio/
    - assets/audio/chapter/chapter_01_ocean.mp3
    - assets/audio/chapter/chapter_02_land.mp3
    - assets/audio/chapter/chapter_03_sky.mp3
    - assets/audio/chapter/chapter_04_history.mp3
    - assets/audio/chapter/chapter_05_technology.mp3
    - assets/audio/chapter/chapter_06_universe.mp3
    - assets/audio/chapter/chapter_unlock.mp3
    - assets/audio/gameplay/tile_merge.mp3
    - assets/audio/gameplay/tile_move.mp3
    - assets/audio/system/game_over.mp3
    - assets/audio/tools/tool_select.mp3
    - assets/audio/ui/button_cancel.mp3
    - assets/audio/ui/button_click.mp3
    - assets/audio/ui/menu_close.mp3
    - assets/audio/ui/menu_open.mp3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
