name: Android Debug APK

on:
  push:
    branches:
      - feature/chapter1-spec-implementation
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android-debug-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Supabase client configuration
        shell: bash
        run: |
          if [[ -z "$SUPABASE_URL" ]]; then
            echo "::error::GitHub Actions secret SUPABASE_URL is missing."
            exit 1
          fi
          if [[ -z "$SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "::error::GitHub Actions secret SUPABASE_PUBLISHABLE_KEY is missing."
            exit 1
          fi
          if [[ "$SUPABASE_URL" != "https://imwgwdfqhhihdvrpkgwx.supabase.co" ]]; then
            echo "::error::SUPABASE_URL must point to the Rebirth 2048 Supabase project."
            exit 1
          fi
          if [[ "$SUPABASE_PUBLISHABLE_KEY" != sb_publishable_* ]]; then
            echo "::error::SUPABASE_PUBLISHABLE_KEY must be a Supabase publishable key (sb_publishable_...)."
            exit 1
          fi

      - name: Build Android debug APK with Supabase
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rebirth-2048-android-supabase-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
