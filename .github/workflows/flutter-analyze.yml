name: Flutter Analyze

on:
  push:
    branches:
      - feature/chapter1-spec-implementation
  pull_request:
    branches:
      - feature/chapter1-spec-implementation

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Flutter tests
        run: flutter test

      - name: Supabase source contract tests
        run: node --test supabase/tests/*.test.js
