name: Supabase Audit

on:
  push:
    branches:
      - feature/chapter1-spec-implementation
  pull_request:
    branches:
      - feature/chapter1-spec-implementation

jobs:
  replay-validator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8

      - name: Run replay validator tests
        run: deno test supabase/functions/_shared/replay_validator_test.ts

      - name: Check replay validator JavaScript syntax
        run: node --check supabase/functions/_shared/replay_validator.js

      - name: Check patch whitespace
        run: git diff --check
