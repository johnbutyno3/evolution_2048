name: Supabase Audit

on:
  push:
    branches:
      - feature/chapter1-spec-implementation
  pull_request:
    branches:
      - feature/chapter1-spec-implementation

jobs:
  replay-validator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8

      - name: Run replay validator tests
        run: deno test supabase/functions/_shared/replay_validator_test.ts

      - name: Run Supabase source contract tests
        run: node --test supabase/tests/*.test.js

      - name: Check replay validator JavaScript syntax
        run: node --check supabase/functions/_shared/replay_validator.js

      - name: Type-check Supabase Edge Functions
        run: |
          deno check supabase/functions/account-snapshot/index.ts
          deno check supabase/functions/start-game-session/index.ts
          deno check supabase/functions/resume-game-session/index.ts
          deno check supabase/functions/restart-game-session/index.ts
          deno check supabase/functions/save-game-checkpoint/index.ts
          deno check supabase/functions/finish-game-chapter/index.ts
          deno check supabase/functions/abandon-game-session/index.ts
          deno check supabase/functions/discover-creature/index.ts
          deno check supabase/functions/purchase-tool-package/index.ts
          deno check supabase/functions/admin-update-shop-config/index.ts
          deno check supabase/functions/register-legacy-identity-link/index.ts
          deno check supabase/functions/import-legacy-account/index.ts

      - name: Check patch whitespace
        run: git diff --check
