name: Supabase Database Integration

on:
  push:
    branches:
      - feature/chapter1-spec-implementation
  pull_request:
    branches:
      - feature/chapter1-spec-implementation

jobs:
  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start disposable local Supabase stack
        run: supabase start

      - name: Apply all migrations to clean local database
        run: supabase db reset

      - name: Run PostgreSQL database integration tests
        run: supabase test db

      - name: Stop disposable local Supabase stack
        if: always()
        run: supabase stop --no-backup
