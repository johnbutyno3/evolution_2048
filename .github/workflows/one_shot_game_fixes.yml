name: One-shot game fixes

on:
  push:
    branches:
      - feature/chapter1-spec-implementation

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: feature/chapter1-spec-implementation

      - name: Apply game fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          engine = Path('lib/game/services/game_engine.dart')
          text = engine.read_text(encoding='utf-8-sig')
          old = '''  bool deductLifeForRestart() {
    if (_lives <= 0) {
      return false;
    }

    _deductLife();

    return true;
  }
'''
          new = '''  bool deductLifeForRestart() {
    if (_lives <= 0) {
      return false;
    }

    _deductLife();

    return true;
  }

  /// Consume one life when a gameplay page is entered.
  ///
  /// This starts the normal regeneration countdown immediately when a
  /// non-Golden player begins a gameplay session. It does not alter
  /// membership status and is separate from Game Over/Restart deductions.
  bool consumeLifeForGameEntry() {
    if (_lives <= 0) {
      return false;
    }

    _deductLife();
    _saveLocal();
    return true;
  }
'''
          if old not in text:
              raise SystemExit('game_engine insertion point not found')
          engine.write_text(text.replace(old, new, 1), encoding='utf-8')

          page = Path('lib/game/screens/evolution_2048_page.dart')
          text = page.read_text(encoding='utf-8-sig')

          text = text.replace(
              "  Timer? _uiRefreshTimer;\n",
              "  Timer? _uiRefreshTimer;\n  bool _lifeConsumedForSession = false;\n",
              1,
          )

          text = text.replace(
              "      _resumeGameplay();\n\n      AudioManager.instance.initialize().then((_) {",
              "      if (!_lifeConsumedForSession) {\n        _engine.consumeLifeForGameEntry();\n        _lifeConsumedForSession = true;\n      }\n\n      _resumeGameplay();\n\n      AudioManager.instance.initialize().then((_) {",
              1,
          )

          text = text.replace(
              "    _engine.pauseGameTimer();\n    _completionAnimationController.dispose();",
              "    _engine.pauseGameTimer();\n    unawaited(AudioManager.instance.stopMusic());\n    _completionAnimationController.dispose();",
              1,
          )

          text = text.replace(
              "    setState(() {\n      _completionAnimationPlaying = false;\n      _completionAnimationIndex = null;\n      _completionAnimationImagePath = null;\n    });",
              "    setState(() {\n      _completionAnimationPlaying = false;\n    });",
              1,
          )

          old_appbar = '''        actions: [
          IconButton(
            onPressed: () {
              unawaited(AudioManager.instance.playSfx(GameSfx.buttonClick));
              _reset();
            },
            tooltip: 'Restart',
            icon: const Icon(Icons.refresh),
          ),
          IconButton(
'''
          new_appbar = '''        actions: [
          IconButton(
'''
          if old_appbar not in text:
              raise SystemExit('appbar restart block not found')
          text = text.replace(old_appbar, new_appbar, 1)

          old_time = '''                          Text(
                            '${l10n.gameTime} ${_engine.formattedGameTime}',
                            style: Theme.of(context).textTheme.titleMedium,
                          ),
'''
          new_time = '''                          Row(
                            mainAxisSize: MainAxisSize.min,
                            children: [
                              Text(
                                '${l10n.gameTime} ${_engine.formattedGameTime}',
                                style: Theme.of(context).textTheme.titleMedium,
                              ),
                              IconButton(
                                onPressed: _completionAnimationPlaying
                                    ? null
                                    : () {
                                        unawaited(
                                          AudioManager.instance.playSfx(
                                            GameSfx.buttonClick,
                                          ),
                                        );
                                        _reset();
                                      },
                                tooltip: 'Restart',
                                visualDensity: VisualDensity.compact,
                                padding: EdgeInsets.zero,
                                constraints: const BoxConstraints(
                                  minWidth: 32,
                                  minHeight: 32,
                                ),
                                icon: const Icon(Icons.refresh, size: 20),
                              ),
                            ],
                          ),
'''
          if old_time not in text:
              raise SystemExit('game time block not found')
          text = text.replace(old_time, new_time, 1)

          text = text.replace(
              "                                      child: tile == null || isAnimatedTile\n                                          ? const SizedBox.shrink()",
              "                                      child: tile == null\n                                          ? const SizedBox.shrink()",
              1,
          )

          text = text.replace(
              "                    'Score $score  ?? Highest $highestValue',",
              "                    'Score $score  •  Highest $highestValue',",
              1,
          )

          page.write_text(text, encoding='utf-8')
          PY

      - name: Verify edits
        run: |
          grep -q "consumeLifeForGameEntry" lib/game/services/game_engine.dart
          grep -q "unawaited(AudioManager.instance.stopMusic())" lib/game/screens/evolution_2048_page.dart
          grep -q "'Score \$score  •  Highest \$highestValue'" lib/game/screens/evolution_2048_page.dart
          grep -q "_lifeConsumedForSession" lib/game/screens/evolution_2048_page.dart

      - name: Commit fixes and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/game/services/game_engine.dart lib/game/screens/evolution_2048_page.dart .github/workflows/one_shot_game_fixes.yml
          git commit -m "fix: gameplay life music completion and restart UI [skip ci]"
          git push origin feature/chapter1-spec-implementation
