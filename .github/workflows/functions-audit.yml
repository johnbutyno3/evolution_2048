name: Functions Audit

on:
  push:
    branches:
      - feature/chapter1-spec-implementation
  pull_request:
    branches:
      - feature/chapter1-spec-implementation

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          for file in *.js; do
            node --check "$file"
          done

      - name: Run Functions tests
        run: npm test

      - name: Set up Java for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Firestore transaction integration tests
        working-directory: .
        run: npx --yes firebase-tools@latest emulators:exec --project demo-rebirth-2048 --only firestore "cd functions && npm run test:emulator"
