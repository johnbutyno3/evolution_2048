name: Functions Audit

on:
  push:
    branches:
      - feature/chapter1-spec-implementation
      - fix/game-state-root-cause-20261019
  pull_request:
    branches:
      - feature/chapter1-spec-implementation

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud_backend/functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cloud_backend/functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          for file in *.js; do
            node --check "$file"
          done

      - name: Run Functions tests
        run: npm test
