name: Backend Rewrite Checks

on:
  push:
    branches:
      - rewrite/backend-api-contract
  pull_request:
    branches:
      - feature/chapter1-spec-implementation
      - rewrite/backend-api-contract

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud_backend/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cloud_backend/functions/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax and lint checks
        run: npm run lint
      - name: Unit tests
        run: npm test
