name: one-time-game-session-replay-patch

on:
  push:
    branches:
      - feature/chapter1-spec-implementation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/chapter1-spec-implementation
          fetch-depth: 0

      - name: Apply patch
        shell: python
        run: |
          from pathlib import Path

          replay = Path('lib/game/services/replay_log.dart')
          text = replay.read_text(encoding='utf-8-sig')
          old = """  Map<String, dynamic> toJson() => <String, dynamic>{\n        'replayVersion': currentVersion,\n"""
          new = """  Map<String, dynamic> toJson() => <String, dynamic>{\n        'version': currentVersion,\n        'replayVersion': currentVersion,\n"""
          assert old in text, 'ReplayLog toJson marker not found'
          text = text.replace(old, new, 1)
          old = """    final version = raw['replayVersion'];\n"""
          new = """    final version = raw['version'] ?? raw['replayVersion'];\n"""
          assert old in text, 'ReplayLog version parser marker not found'
          text = text.replace(old, new, 1)
          replay.write_text(text, encoding='utf-8')

          page = Path('lib/game/screens/evolution_2048_page.dart')
          text = page.read_text(encoding='utf-8-sig')

          old = """  Timer? _uiRefreshTimer;\n\n  static const double _swipeThreshold = 30;\n"""
          new = """  Timer? _uiRefreshTimer;\n  bool _gameSessionStarting = false;\n\n  static const double _swipeThreshold = 30;\n"""
          assert old in text, 'Session state marker not found'
          text = text.replace(old, new, 1)

          old = """      _resumeGameplay();\n      unawaited(\n        _engine.refreshToolProgress().then((_) {\n"""
          new = """      _resumeGameplay();\n      PlayerProgressService.instance.clearGameSession();\n      if (!_engine.gameOver && !_engine.chapterComplete) {\n        unawaited(_ensureGameSession());\n      }\n      unawaited(\n        _engine.refreshToolProgress().then((_) {\n"""
          assert old in text, 'Session startup marker not found'
          text = text.replace(old, new, 1)

          old = """  void _startUiRefreshTimer() {\n"""
          new = """  Future<bool> _ensureGameSession() async {\n    if (_gameSessionStarting) {\n      while (_gameSessionStarting) {\n        await Future<void>.delayed(const Duration(milliseconds: 20));\n      }\n      return PlayerProgressService.instance.activeGameSessionId != null;\n    }\n\n    if (PlayerProgressService.instance.activeGameSessionId != null) {\n      return true;\n    }\n\n    _gameSessionStarting = true;\n    try {\n      return await PlayerProgressService.instance.startGameSession(\n        _chapterNumber - 1,\n      );\n    } finally {\n      _gameSessionStarting = false;\n    }\n  }\n\n  void _startUiRefreshTimer() {\n"""
          assert old in text, 'Session helper insertion marker not found'
          text = text.replace(old, new, 1)

          old = """    if (!restarted) {\n      return false;\n    }\n\n    _engine.startGameTimer();\n"""
          new = """    if (!restarted) {\n      return false;\n    }\n\n    PlayerProgressService.instance.clearGameSession();\n    unawaited(_ensureGameSession());\n\n    _engine.startGameTimer();\n"""
          assert old in text, 'Restart session marker not found'
          text = text.replace(old, new, 1)

          old = """    } else {\n      Navigator.of(context).pop();\n    }\n  }\n\n  // ============================================================\n  // Background\n"""
          new = """    } else {\n      PlayerProgressService.instance.clearGameSession();\n      Navigator.of(context).pop();\n    }\n  }\n\n  // ============================================================\n  // Background\n"""
          assert old in text, 'Game over session clear marker not found'
          text = text.replace(old, new, 1)

          old = """    _chapterCompleteShowing = true;\n    _engine.stopGameTimer();\n\n    final completedChapter = _engine.chapter;\n"""
          new = """    _chapterCompleteShowing = true;\n    _engine.stopGameTimer();\n\n    // The session must exist before the server validates the replay.\n    // This also covers very fast/debug completion before the post-frame\n    // session startup has finished.\n    if (!await _ensureGameSession()) {\n      _chapterCompleteShowing = false;\n      return;\n    }\n\n    final completedChapter = _engine.chapter;\n"""
          assert old in text, 'Completion session marker not found'
          text = text.replace(old, new, 1)

          old = """    await PlayerProgressService.instance.completeChapter(\n      chapterIndex: _chapterNumber - 1,\n      replayLog: Map<String, dynamic>.from(replayLog),\n    );\n\n    await AudioManager.instance.stopMusic();\n"""
          new = """    final completionAccepted =\n        await PlayerProgressService.instance.completeChapter(\n          chapterIndex: _chapterNumber - 1,\n          replayLog: Map<String, dynamic>.from(replayLog),\n        );\n\n    if (!completionAccepted) {\n      _chapterCompleteShowing = false;\n      return;\n    }\n\n    await AudioManager.instance.stopMusic();\n"""
          assert old in text, 'Completion result marker not found'
          text = text.replace(old, new, 1)

          old = """    setState(() {\n      _engine = GameEngine(chapter: chapter, forceNewBoard: forceNewBoard);\n\n      _toolMode = null;\n"""
          new = """    PlayerProgressService.instance.clearGameSession();\n\n    setState(() {\n      _engine = GameEngine(chapter: chapter, forceNewBoard: forceNewBoard);\n\n      _toolMode = null;\n"""
          assert old in text, 'Chapter transition session marker not found'
          text = text.replace(old, new, 1)

          old = """    _engine.updateLifeFromRealTime();\n    _engine.startGameTimer();\n    _startUiRefreshTimer();\n\n    AudioManager.instance.playChapterMusic(chapter);\n"""
          new = """    _engine.updateLifeFromRealTime();\n    _engine.startGameTimer();\n    _startUiRefreshTimer();\n    unawaited(_ensureGameSession());\n\n    AudioManager.instance.playChapterMusic(chapter);\n"""
          assert old in text, 'Chapter session startup marker not found'
          text = text.replace(old, new, 1)

          page.write_text(text, encoding='utf-8')

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/game/services/replay_log.dart lib/game/screens/evolution_2048_page.dart
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "security: integrate game sessions with replay completion"
          git push origin HEAD:feature/chapter1-spec-implementation

      - name: Remove one-time workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/one_time_game_session_patch.yml
          git commit -m "chore: remove one-time game session patch workflow"
          git push origin HEAD:feature/chapter1-spec-implementation
